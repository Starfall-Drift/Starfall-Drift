- type: reagent
  id: VoidIchor
  name: Void Ichor
  desc: A strange, starry fluid that bridges normal space and void space.
  flavor: voidichor
  color: "#2c2cdb"
  physicalDesc: starry
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Slash: 0.25
            Asphyxiation: 1
