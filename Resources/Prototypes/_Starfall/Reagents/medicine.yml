- type: reagent
  id: Lenturi
  name: reagent-name-lenturi
  desc: reagent-desc-lenturi
  group: Medicine
  physicalDesc: reagent-physical-desc-tropical
  flavor: medicine
  color: "#634aef"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -0.6 #3 per type per unit. No evenheal
            Cold: -0.6
            Shock: -0.6
      - !type:Satiate
        satiationType: Thirst
        factor: -1
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Lenturi
          min: 20 #Overdose
      - !type:Satiate
