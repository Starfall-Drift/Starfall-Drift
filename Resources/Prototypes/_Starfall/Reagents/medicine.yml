#Brutes
- type: reagent
  id: Libital
  name: reagent-name-libital
  desc: reagent-desc-libital
  group: Medicine
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#e8d199"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -1.2 #2 per type per unit. No evenheal
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Libital
          min: 20
        damage:
          Heat: 1 #5 per unit.
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Libital
          min: 20

- type: reagent
  id: Probital
  name: reagent-name-probital
  desc: reagent-desc-probital
  group: Medicine
  physicalDesc: reagent-physical-desc-syrupy
  flavor: medicine
  color: "#e8e699"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Probital
          max: 20 #Only heals when below 20u.
        damage:
          groups:
            Brute: -1.8 #3 per type per unit. No evenheal
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Probital
          min: 20
        probability: 0.02
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.7
        sprintSpeedModifier: 0.7
      - !type:MovementSpeedModifier
        conditions:
        - !type:ReagentCondition
          reagent: Probital
          min: 20
        walkSpeedModifier: 0.35
        sprintSpeedModifier: 0.35

- type: reagent
  id: SalicylicAcid
  name: reagent-name-salicylicacid
  desc: reagent-desc-salicylicacid
  group: Medicine
  physicalDesc: reagent-physical-desc-mucus-like
  flavor: medicine
  color: "#f9e0e9"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:DamageGroupCondition
          group: Brute
          max: 30
        damage:
          Brute: -0.45 #0.15 per type
      - !type:EvenHealthChange
        conditions:
        - !type:DamageGroupCondition
          group: Brute
          min: 30
        damage:
          Brute: -2.25 #0.75 per type
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: SalicylicAcid
          min: 15.5
        damage:
          groups:
            Burn: 2 #0.5 to heat, shock, cold, and caustic
      - !type:EvenHealthChange
        conditions:
        - !type:ReagentCondition
          reagent: SalicylicAcid
          min: 15.5
        damage:
          Brute: -2.25 #heals an extra time during OD
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: SalicylicAcid
          min: 15.5

