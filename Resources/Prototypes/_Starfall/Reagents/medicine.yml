#Toxins
- type: reagent
  id: Multiver
  name: reagent-name-multiver
  desc: reagent-desc-multiver
  group: Medicine
  physicalDesc: reagent-physical-desc-grainy
  flavor: medicine
  color: "#36274f"
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -1 #5 per u, 25 per 5u
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 20
          reagent: Multiver
        damage:
          types:
            Caustic: 2 #10 per u, 50 per 5u
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          min: 20
          reagent: Multiver
  plantMetabolism: #identical to dylovene in terms of plant care
  - !type:PlantAdjustToxins
    amount: -10
  - !type:PlantAdjustHealth
    amount: 1

- type: reagent
  id: PenteticAcid
  name: reagent-name-penteticacid
  desc:  reagent-desc-penteticacid
  group: Medicine
  physicalDesc: reagent-physical-desc-acidic
  flavor: medicine
  color: "#3a0c28"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.4
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -3 #7.5 per u, 37.5 per 5u
      - !type:CleanBloodstream
        excluded: PenteticAcid #Prevents it from purging itself.
        cleanseRate: 3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 15.5
          reagent: PenteticAcid
        damage:
          types:
            Caustic: 3
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          min: 15.5
          reagent: PenteticAcid
      - !type:Emote
        emote: Scream
        probability: 0.3
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          min: 15.5
          reagent: PenteticAcid
        probability: 0.3

