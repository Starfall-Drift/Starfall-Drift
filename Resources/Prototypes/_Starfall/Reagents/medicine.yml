          reagent: Lenturi
          min: 20
        satiationType: Thirst
        factor: -3 #Basically do the non-OD effect three extra times when ODing.

- type: reagent
  id: Oxandrolone #This one is a doozy
  name: reagent-name-oxandrolone
  desc: reagent-desc-oxandrolone
  group: Medicine
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#e6e600"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange #We use normal healthchange cause I don't want this healing caustic which evenheal will do
        conditions:
        - !type:DamageGroupCondition
          max: 30
          group: Burn
        damage:
          types:
            Heat: -0.2
            Cold: -0.2
            Shock: -0.2
      - !type:HealthChange #We use normal healthchange cause I don't want this healing caustic which evenheal will do
        conditions:
        - !type:DamageGroupCondition
          min: 30
          group: Burn
        damage:
          types:
            Heat: -0.8
            Cold: -0.8
            Shock: -0.8
      - !type:HealthChange #We use normal healthchange cause I don't want this healing caustic which evenheal will do
        conditions:
        - !type:ReagentCondition
          min: 15.5
          reagent: Oxandrolone
        damage:
          types: #OD heals additonal separate from the other instance of healing but hurts.
            Heat: -0.8
            Cold: -0.8
            Shock: -0.8
            Blunt: 2
            Piercing: 0.5
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          min: 15.5
          reagent: Oxandrolone

