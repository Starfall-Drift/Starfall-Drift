- type: entity
  id: ReagentSlimeSpewium
  parent: ReagentSlime
  suffix: Spewium
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Spewium
        Quantity: 100
  - type: PointLight
    color: "#2e4404"
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/elemental.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      color: "#2e4404"

