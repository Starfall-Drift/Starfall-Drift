- type: entity
  parent: BaseItem
  id: BoxSurvivalSlots
  name: survival box
  description: It's a box with basic internals inside.
  suffix: Standard, Slots
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/emergencybox.rsi
    state: box
  - type: Appearance
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: ContainerContainer
    containers:
      drink: !type:ContainerSlot
      mask: !type:ContainerSlot
      tank: !type:ContainerSlot
      light: !type:ContainerSlot
      food: !type:ContainerSlot
      emergencypen: !type:ContainerSlot
      spacepen: !type:ContainerSlot
  - type: ItemSlots
    slots:
      drink:
        ejectOnInteract: false
        whitelist:
          tags:
          - DrinkBottle
      mask:
        ejectOnInteract: false
        whitelist:
          tags:
          - BreathMask
          - SecurityBreathMask
          - SyndicateBreathMask
      tank:
        ejectOnInteract: false
        whitelist:
          tags:
          - EmergencyOxygenTank
          - ExtendedEmergencyOxygenTank
          - FunnyEmergencyOxygenTank
          - EmergencyNitrogenTank
      light:
        ejectOnInteract: false
        whitelist:
          tags:
          - Flare
      food:
        ejectOnInteract: false
        whitelist:
          tags:
          - FoodSnack
      emergencypen:
        ejectOnInteract: false
        whitelist:
          tags:
          - EmergencyMedipen
      spacepen:
        ejectOnInteract: false
        whitelist:
          tags:
          - SpaceMedipen
  - type: EntityTableContainerFill
    containers:
      drink: !type:EntSelector
      - id: DrinkWaterBottleFull
      mask: !type:EntSelector
      - id: ClothingMaskBreath
      tank: !type:EntSelector
      - id: EmergencyOxygenTank
      light: !type:GroupSelector
          children:
          - id: GlowstickBlue
          - id: GlowstickGreen
          - id: GlowstickYellow
            weight: 0.5
          - id: GlowstickPurple
            weight: 0.25
          - id: GlowstickRed
            weight: 0.1
      food: !type:EntSelector
      - id: FoodSnackNutribrick
      emergencypen: !type:EntSelector
      - id: EmergencyMedipen
      spacepen: !type:EntSelector
      - id: SpaceMedipen
  - type: ItemMapper
    mapLayers:
      drink:
        whitelist:
          tags:
          - DrinkBottle
      mask:
        whitelist:
          tags:
          - BreathMask
      secmask:
        whitelist:
          tags:
          - SecurityBreathMask
      syndimask:
        whitelist:
          tags:
          - SyndicateBreathMask
      oxygen:
        whitelist:
          tags:
          - EmergencyOxygenTank
      extendedoxygen:
        whitelist:
          tags:
          - ExtendedEmergencyOxygenTank
      funnyoxygen:
        whitelist:
          tags:
          - FunnyEmergencyOxygenTank
      nitrogen:
        whitelist:
          tags:
          - EmergencyNitrogenTank
      light:
        whitelist:
          tags:
          - Flare
      food:
        whitelist:
          tags:
          - FoodSnack
      emergencypen:
        whitelist:
          tags:
          - EmergencyMedipen
      spacepen:
        whitelist:
          tags:
          - SpaceMedipen


