# Top level timer for master medical players
- type: loadoutEffectGroup
  id: SeniorPhysician
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Medical
      time: 4h # Starfall

# Mid-level timer for players who have a solid amount of experience // Starfall The fuck you mean mid-level dude its 20 hours
- type: loadoutEffectGroup
  id: MedicalJourneymanTimer
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobMedicalDoctor
      time: 2h # Starfall

# Mid-level timer for CMO
- type: loadoutEffectGroup
  id: MasterCMO
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChiefMedicalOfficer
      time: 10h # Starfall
