- type: entity
  id: MedkitFilled
  suffix: Filled
  parent: Medkit
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
        - id: Ointment
        - id: Gauze
        - id: PillCanisterTricordrazine
        - id: PillCanisterGranibitulari #Starfallchem
        - id: HandheldHealthAnalyzer    #Starfallchem - Added to all medkits
      # see https://github.com/tgstation/blob/master/code/game/objects/items/storage/firstaid.dm for example contents

- type: entity
  id: MedkitBurnFilled
  suffix: Filled
  parent: MedkitBurn
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Ointment
          amount: 2
        - id: PillCanisterAiuri #Starfallchem - Kelotane -> Aiuri
        - id: PillCanisterLenturi #Starfallchem - Dermaline -> Lenturi
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitBruteFilled
  suffix: Filled
  parent: MedkitBrute
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
        - id: Gauze
        - id: SyringeSaline
          amount: 2
        - id: PillCanisterLibital #Starfallchem - Iron -> Libital
        - id: PillCanisterProbital #Starfallchem - Copper -> Probital
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitToxinFilled
  suffix: Filled
  parent: MedkitToxin
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SyringeIpecac
        - id: SyringeEthylredoxrazine
        - id: AntiPoisonMedipen
          amount: 2 #Starfallchem - add another
        - id: PillCanisterMultiver #Starfallchem - Dylovene -> Multiver
        - id: PillCanisterCharcoal
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitOxygenFilled
  suffix: Filled
  parent: MedkitO2
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreathMedical
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
          amount: 2 #Starfallchem - add another
        - id: SyringeConvermol #Starfallchem - Inaprovaline -> Convermol
          amount: 2 #Starfallchem - add another
        - id: PillCanisterDexalin
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitRadiationFilled
  suffix: Filled
  parent: MedkitRadiation
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SyringePhalanximine
        - id: RadAutoInjector
        - id: PillCanisterPotassiumIodide
          amount: 2 #Starfallchem - add another
        - id: PillCanisterHyronalin
          amount: 2 #Starfallchem - add another
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitAdvancedFilled
  suffix: Filled
  parent: MedkitAdvanced
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        - id: Bloodpack
          amount: 1 #Starfallchem - 2 -> 1
        - id: SyringeSaline #Starfallchem - Add this
          amount: 2
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: MedkitCombatFilled
  suffix: Filled
  parent: MedkitCombat
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        - id: SyringeRevivopine #Starfallchem - Ephedrine -> Revivopine
        - id: SyringeSaline
        - id: BruteAutoInjector
        - id: BurnAutoInjector
        - id: HandheldHealthAnalyzer #Starfallchem - added to all medkits

- type: entity
  id: StimkitFilled
  suffix: Stimkit, Filled
  parent: Medkit
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: StimpackMini
        amount: 6
